<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>Piano Lessons</title>
<style>
  :root {
    --bg: #14121f; --panel: #1e1b2e; --ink: #f4f1ff; --muted: #a39fbd;
    --accent: #f5b841; --accent-ink: #1e1b2e; --ring: #f5b841;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden;
    -webkit-user-select: none; user-select: none; }
  .app { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 16px; height: 100%; padding: 16px; }
  .stage { display: flex; flex-direction: column; min-width: 0; min-height: 0; gap: 12px; }
  header { display: flex; align-items: center; gap: 10px; }
  header h1 { margin: 0; font-size: 22px; letter-spacing: .3px; }
  header .keys { width: 34px; height: 24px; border-radius: 5px;
    background: repeating-linear-gradient(90deg, #fff 0 7px, var(--bg) 7px 8.5px); }
  .player-wrap { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; }
  .player { position: relative; width: 100%; max-height: 100%; aspect-ratio: 16 / 9; border-radius: 14px;
    overflow: hidden; background: #000; }
  /* Our own screen over the player while paused/ended, so YouTube's "More videos" never shows */
  .cover { position: absolute; inset: 0; display: none; flex-direction: column; align-items: center;
    justify-content: center; gap: 14px; background: rgba(20,18,31,.94); z-index: 2; }
  .cover.on { display: flex; }
  .cover .big { border: 0; border-radius: 18px; background: var(--accent); color: var(--accent-ink);
    font-size: 30px; font-weight: 800; padding: 22px 44px; }
  .cover .sub { color: var(--muted); font-size: 18px; text-align: center; padding: 0 20px; }
  /* The iframe is 120px taller than the box and shifted up 60px: the video letterboxes inside it,
     so only black bars plus YouTube's edge overlays (title, "More videos") fall outside and are clipped. */
  .player iframe, #player { position: absolute; left: 0; top: -60px; width: 100%; height: calc(100% + 120px);
    border: 0; display: block; }
  .shield { position: absolute; inset: 0; z-index: 1; }   /* taps never reach YouTube's player */
  .controls { display: flex; align-items: center; gap: 12px; }
  .btn { flex: none; border: 0; border-radius: 14px; background: var(--accent); color: var(--accent-ink);
    font-size: 20px; font-weight: 700; padding: 16px 26px; min-width: 150px; }
  .btn:active { transform: scale(.97); }
  .btn[disabled] { opacity: .35; }
  .now { flex: 1; min-width: 0; text-align: center; }
  .now .n { color: var(--accent); font-weight: 700; font-size: 15px; }
  .now .t { font-size: 17px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  aside { background: var(--panel); border-radius: 14px; padding: 12px; overflow-y: auto; }
  aside h2 { margin: 2px 4px 10px; font-size: 15px; color: var(--muted); font-weight: 600; }
  .lesson { position: relative; display: block; width: 100%; border: 3px solid transparent; padding: 0;
    border-radius: 12px; overflow: hidden; margin-bottom: 10px; background: #000; aspect-ratio: 16 / 9; }
  .lesson img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .lesson .num { position: absolute; left: 8px; top: 8px; background: rgba(20,18,31,.85); color: var(--ink);
    font-weight: 700; font-size: 15px; border-radius: 8px; padding: 3px 9px; }
  .lesson.current { border-color: var(--ring); }
  .nameok { display: inline-block; margin-left: 8px; padding: 6px 14px; border-radius: 10px; background: #5fd38f; color: #06210f; font-weight: 800; }
  .lesson .seen { position: absolute; right: 6px; bottom: 6px; background: rgba(20,18,31,.85); color: #8ff0b4; font-weight: 700; font-size: 12px; border-radius: 8px; padding: 1px 6px; }
  .lesson.current .num { background: var(--accent); color: var(--accent-ink); }
  .msg { text-align: center; color: var(--muted); padding: 24px; font-size: 18px; }
  .msg button { margin-top: 14px; }
  /* grown-up exit */
  .gate { position: fixed; inset: 0; background: rgba(10,9,16,.92); display: none;
    align-items: center; justify-content: center; z-index: 10; }
  .gate.open { display: flex; }
  .gate .card { background: var(--panel); border-radius: 18px; padding: 24px; width: 340px; text-align: center; }
  /* Play along: keyboard under the video, narrow lesson strip, no Back/Next row */
  .piano { display: none; height: 36vh; min-height: 190px; gap: 8px; align-items: stretch; }
  body.play .piano { display: flex; }
  /* short video area: size the 16:9 box by height so the video is letterboxed, not cropped */
  /* Play along + Big video: the video fills the width and sits on the bottom edge, so the top is cut off and the
     lesson's keyboard (bottom of the video) lines up right above our piano. The iframe stays 120px taller than the
     16:9 video, so YouTube's edge overlays still fall in the clipped black bars. */
  body.play .player { width: auto; height: 100%; max-width: 100%; }   /* Normal view: the whole 16:9 video, fitted (only Big video is oversized) */
  body.big .player { width: 100%; height: 100%; max-width: 100%; aspect-ratio: auto; container-type: inline-size; }
  body.big .player iframe, body.big #player { top: auto; bottom: -60px; height: calc(100cqw * 9 / 16 + 120px); }
  body.play .controls { display: none; }
  body.play .app { grid-template-columns: 1fr 150px; gap: 10px; padding: 8px 10px; }
  body.play .stage { gap: 8px; }
  body.play header .keys, body.play aside h2 { display: none; }
  body.play aside { padding: 6px; }
  body.play .lesson { margin-bottom: 6px; border-width: 2px; border-radius: 8px; }
  body.play .lesson .num { font-size: 12px; padding: 1px 6px; left: 4px; top: 4px; }
  .piano .side { flex: none; display: flex; flex-direction: column; gap: 6px; }
  .piano .side .oct { flex: 1; }
  .oct.zoom { flex: 0 0 34% !important; font-size: 26px; font-weight: 700; }
  body.keylock .oct.zoom { display: none; }
  .oct { flex: none; width: 46px; border: 0; border-radius: 12px; background: #2b2742; color: var(--ink); font-size: 20px; }
  .keys-row { position: relative; flex: 1; display: flex; touch-action: none; border-radius: 10px; overflow: hidden;
    background: #000; padding-top: 4px; }
  .wk { position: relative; flex: 1; margin: 0 1.5px; background: linear-gradient(#f4f1ea, #fffdf8 70%, #e9e4d8);
    border-radius: 0 0 8px 8px; display: flex; align-items: flex-end; justify-content: center; padding-bottom: 10px;
    color: #4a4560; font-weight: 700; font-size: 20px; }
  .bk { position: absolute; top: 4px; height: 60%; background: linear-gradient(#2b2836, #111018);
    border-radius: 0 0 6px 6px; z-index: 2; box-shadow: 0 3px 4px rgba(0,0,0,.5); }
  .wk.on { background: linear-gradient(#f5b841, #ffd77a); color: #1e1b2e; }
  .bk.on { background: linear-gradient(#c98a12, #f5b841); }
  .bk span { position: absolute; left: 0; right: 0; bottom: 7px; text-align: center; color: #cfc8f0; font-size: 12px; font-weight: 600; line-height: 1; pointer-events: none; }
  .bk.on span { color: #2a1c00; }
  .nm { display: block; text-align: center; font-weight: inherit; line-height: 1.05; pointer-events: none; }
  .two .wk .c-oct { bottom: 58px; }
  .nm small { display: block; font-size: .7em; opacity: .75; margin-top: 2px; }
  .bk span { font-size: 11px; letter-spacing: -.02em; }
  #instPop .space { grid-column: 1 / -1; display: flex; align-items: center; gap: 10px; margin-top: 4px; padding-top: 12px; border-top: 1px solid #ffffff1a; }
  #instPop .space > span { color: var(--muted); font-size: 15px; white-space: nowrap; }
  #instPop .space button { flex: 1; padding: 10px 4px; font-size: 15px; }
  #instPop .space button b { display: inline; font-size: 20px; }
  .wk .c-oct { position: absolute; bottom: 38px; font-size: 12px; color: #a39fbd; font-weight: 600; }   /* below the black keys, so zoomed-out keys still show it */
  .vol { display: none; align-items: center; gap: 6px; color: var(--muted); font-size: 15px; margin-left: auto; }
  body.play .vol { display: flex; }
  body.play #playMode { margin-left: 0 !important; }
  #instGrid .off { display: none !important; }                  /* sounds the grown-up hid in the Menu */
  #instBtn { display: none; }
  body.play #instBtn { display: block; }
  body.play.sndfix #instBtn { display: none; }
  #instPop { position: fixed; inset: 0; z-index: 8; display: none; align-items: center; justify-content: center; background: rgba(10,8,20,.6); }
  #instPop.open { display: flex; }
  #instPop .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; background: var(--panel); padding: 18px; border-radius: 22px; width: min(640px, 94vw); max-height: 94vh; overflow-y: auto; }
  #instPop button { border: 3px solid transparent; border-radius: 16px; background: #2b2742; color: var(--ink); padding: 14px 4px; font: inherit; font-size: 15px; cursor: pointer; }
  #instPop button b { display: block; font-size: 38px; line-height: 1.2; font-weight: 400; }
  #instPop button.cur { border-color: var(--accent); background: #3a3459; }
  @media (max-width: 560px) { #instPop .grid { grid-template-columns: repeat(2, 1fr); } }
  #instPop .grid { grid-template-columns: repeat(9, 1fr); width: min(1000px, 96vw); gap: 8px; padding: 14px 16px; }
  #instPop button[data-id] { padding: 6px 2px; font-size: 12.5px; line-height: 1.15; }
  #instPop button[data-id] b { font-size: 30px; }
  #instPop .ghead { grid-column: 1 / -1; color: var(--muted); font-size: 14px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; margin: 4px 0 -2px 4px; }
  @media (max-width: 760px) { #instPop .grid { grid-template-columns: repeat(4, 1fr); } }
  /* full screen: header, one stretching row per group, surround row at the bottom */
  #instPop .grid { display: flex; flex-direction: column; width: 100vw; height: 100vh; max-height: none; border-radius: 0 !important; padding: 10px 14px 12px; gap: 7px; box-sizing: border-box; overflow: hidden; }
  #instPop .ptop { display: flex; align-items: center; justify-content: space-between; flex: none; font-size: 20px; font-weight: 700; padding: 0 4px; }
  #instPop .ptop .pclose { font-size: 22px; padding: 6px 18px; }
  #instPop .grid { justify-content: space-between; }
  #instPop .grow { flex: none; display: flex; gap: 6px; align-items: center; }
  #instPop .grow .ghead { flex: 0 0 76px; margin: 0; font-size: 12px; line-height: 1.2; }
  #instPop .gbtns { flex: 1; display: grid; grid-template-columns: repeat(15, 1fr); grid-auto-rows: 58px; gap: 5px; }
  /* phones (or anything shorter than the tablet): fewer, wider buttons and the picker scrolls */
  #instPop .grid { overflow-y: auto; -webkit-overflow-scrolling: touch; touch-action: pan-y; overscroll-behavior: contain; }
  @media (max-height: 560px), (max-width: 900px) {
    #instPop .grid { justify-content: flex-start; }
    #instPop .gbtns { grid-template-columns: repeat(auto-fill, minmax(70px, 1fr)); grid-auto-rows: 62px; }
    #instPop .grow { align-items: flex-start; }
    #instPop .grow .ghead { flex-basis: 64px; padding-top: 20px; }
  }
  #instPop .gbtns button { min-width: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 2px 1px;
    font-size: 11px; line-height: 1.05; border-width: 2px; border-radius: 12px; box-shadow: 0 3px 0 #1b1540; }
  #instPop .gbtns button b { font-size: 26px; line-height: 1.1; }
  #instPop .gbtns button b svg.ic { display: block; width: 30px; height: 30px; }
  #vName input { font: inherit; width: 9em; margin-left: 6px; padding: 4px 8px; border-radius: 8px; border: 2px solid var(--accent); background: #fff; color: #1e1b2e; }
  #instBtn svg.ic { width: 1.3em; height: 1.3em; vertical-align: -0.35em; }
  #instPop { z-index: 60; }
  #instPop .ptop .space { flex: none; margin: 0 14px 0 auto; padding: 0; border-top: 0; gap: 6px; }
  #instPop .ptop .space > span { font-size: 13px; }
  #instPop .ptop .space button { flex: none; padding: 5px 12px; font-size: 13px; }
  #instPop .ptop .space button b { font-size: 16px; }
  .hint { color: var(--muted); font-size: 13px; white-space: nowrap; }
  body:not(.play) .hint { display: none !important; }
  .vol input { width: 130px; accent-color: var(--accent); }

  /* Big video mode: no Back/Next row, a narrow thumbnail strip, the video takes the room */
  body.big .app { grid-template-columns: 1fr 150px; gap: 10px; padding: 8px 10px; }
  body.big .stage { gap: 6px; }
  body.big .controls, body.big header .keys, body.big aside h2 { display: none; }
  body.big header h1 { font-size: 16px; color: var(--muted); }
  body.big aside { padding: 6px; }
  body.big .lesson { margin-bottom: 6px; border-width: 2px; border-radius: 8px; }
  body.big .lesson .num { font-size: 12px; padding: 1px 6px; left: 4px; top: 4px; }
  /* Play along: the piano runs the full width, under the video AND the lesson strip; the strip only sits beside the video */
  body.play .app { grid-template-rows: auto minmax(0, 1fr) auto; }
  body.play .stage { display: contents; }
  body.play header { grid-column: 1; grid-row: 1; }
  body.play .player-wrap { grid-column: 1; grid-row: 2; min-height: 0; }
  body.play aside { grid-column: 2; grid-row: 1 / 3; min-height: 0; }
  body.play .piano { grid-column: 1 / -1; grid-row: 3; }
  /* 1.39: the page must never be wider than the screen. A 1fr column grows to its widest content (the top bar), which made the page
     1047 px on a 1024 px tablet and slid it sideways (left edge and the lesson strip cut off, the strip hard to scroll). */
  body.big .app, body.play .app { grid-template-columns: minmax(0, 1fr) 150px; }
  /* Play along: the lesson strip starts UNDER the top bar, so Menu + Close sit above it, not over its first video;
     the top bar then only keeps room for the part of Menu + Close that reaches into its column */
  body.play:not(.solo) aside { grid-row: 2 / 3; }
  body.play:not(.solo) header { padding-right: 40px; }
  /* 1.40.1 Big video without the piano: same rule, the strip starts under Menu + Close (they covered the Song lessons button) */
  body.big:not(.play) aside { margin-top: 38px; }
  /* Piano only (inside Play along): no video, no lesson strip; the notes he plays fly up out of the keys like Synthesia's free play */
  #soloBtn { display: none; }
  body.play #soloBtn { display: block; }
  .fly { display: none; }
  body.solo .player-wrap, body.solo aside, body.solo .vol, body.solo #mode { display: none !important; }
  body.solo .app { grid-template-columns: 1fr; }
  body.solo header { grid-column: 1 / -1; }
  body.solo .fly { display: block; grid-column: 1 / -1; grid-row: 2; min-height: 0; position: relative; overflow: hidden; border-radius: 16px;
    background: radial-gradient(ellipse 70% 90% at 50% 100%, #2c2378 0%, #17123f 55%, #100c2a 100%); }
  .fly canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  body.solo .piano { height: 44vh; }
  /* Follow the keys: songs that wait for him (js/follow.js) */
  #songBtn { display: none; }
  body.solo #songBtn { display: block; }
  body.infollow #songBtn { background: linear-gradient(#7ad7ff, #3a9be0); color: #04203a; }
  #songPop { position: fixed; inset: 0; z-index: 8; display: none; align-items: center; justify-content: center; background: rgba(10,8,20,.7); }
  #songPop.open { display: flex; }
  .songcard { width: min(960px, 96vw); height: min(560px, 92vh); background: #1d1747; border: 2px solid #5b4bb0; border-radius: 18px; color: #fbf8ff;
    display: flex; flex-direction: column; gap: 10px; padding: 14px 16px; box-sizing: border-box; }
  .songhead { display: flex; align-items: center; gap: 14px; font-size: 22px; }
  .songhead > b { white-space: nowrap; }
  .songseg { display: flex; gap: 8px; }
  .songseg button, .songx, .songlist button, .fwtop button { border: 0; border-radius: 12px; background: #3a3170; color: #fbf8ff; font: 700 16px Fredoka, system-ui, sans-serif; box-shadow: 0 3px 0 #15102f; padding: 8px 12px; }
  .songseg button.sel { background: #ffd86b; color: #2a1f00; box-shadow: 0 3px 0 #9a7a12; }
  .songseg.tabs button { flex: 1; min-width: 0; font-size: 14px; min-height: 42px; padding: 6px 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }   /* 5 tabs on one row */
  .songx { margin-left: auto; width: 44px; height: 44px; padding: 0; font-size: 18px; }
  .songlist { flex: 1; overflow-y: auto; display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); grid-auto-rows: min-content; gap: 10px; align-content: start; padding: 2px 2px 8px; }
  .songlist button { position: relative; text-align: left; display: block; min-height: 58px; height: auto; min-width: 0; overflow: hidden; padding-right: 46px; }   /* block, not flex: a two-line title grows the card */
  /* 1.40 search box (Follow the keys + Song lessons) and the Song lessons pop-up: same card as Follow the keys */
  .songfind { flex: 1; min-width: 140px; font: 600 18px Fredoka, system-ui, sans-serif; padding: 8px 14px; border-radius: 12px; border: 2px solid #5b4bb0; background: #100c2a; color: #fbf8ff; }
  .songfind::placeholder { color: #9d93d6; }
  #slPop { position: fixed; inset: 0; z-index: 8; display: none; align-items: center; justify-content: center; background: rgba(10,8,20,.7); }
  #slPop.open { display: flex; }
  .songlist button.slcard { display: flex; align-items: center; gap: 10px; padding: 6px 10px 6px 6px; }
  .slcard img { width: 112px; aspect-ratio: 16 / 9; object-fit: cover; border-radius: 8px; flex: none; background: #100c2a; }
  .slbtn { display: block; width: 100%; margin: 0 0 6px; border: 0; border-radius: 10px; padding: 8px 6px; background: linear-gradient(#ffd86b, #f0b429); color: #2a1f00;
    font: 700 14px Fredoka, system-ui, sans-serif; box-shadow: 0 3px 0 #9a7a12; position: sticky; top: 0; z-index: 1; }
  .songlist button b, .songlist button span { display: block; overflow-wrap: anywhere; } .songlist button span { margin-top: 3px; }
  .songlist button b { font-size: 15px; line-height: 1.25; } .songlist button span { font-size: 12px; font-weight: 500; color: #c9bff5; } .songlist .st { font-style: normal; }
  .songlist .heart { position: absolute; top: 4px; right: 4px; width: 38px; height: 38px; display: flex; align-items: center; justify-content: center; font: normal 22px system-ui, sans-serif; color: #c9bff5; border-radius: 50%; }
  .songlist button.fav { box-shadow: 0 0 0 2px #ff7aa8, 0 3px 0 #15102f; } .songlist button.fav .heart { color: #ff5c8a; }
  .songtip { font-size: 15px; color: #c9bff5; margin: -2px 2px 0; }
  .songlist button.playing { background: #4a3d95; box-shadow: 0 0 0 3px #ffd86b, 0 3px 0 #15102f; animation: songPulse 1.2s ease-in-out infinite; }
  @keyframes songPulse { 50% { box-shadow: 0 0 0 6px #ffd86b80, 0 3px 0 #15102f; } }
  .songnone { grid-column: 1 / -1; color: #c9bff5; font-size: 18px; text-align: center; margin-top: 40px; }
  .follow { position: absolute; left: 10px; right: 10px; top: 8px; z-index: 2; display: flex; flex-direction: column; gap: 6px; }
  .follow[hidden] { display: none; }
  .follow::before { content: ""; position: absolute; left: -10px; right: -10px; top: -8px; height: 76px; z-index: -1; pointer-events: none;
    background: linear-gradient(#120f2a 55%, #120f2a00); border-radius: 16px 16px 0 0; }   /* falling notes fade in under the song bar */
  .fwtop { display: flex; align-items: center; gap: 10px; color: #fbf8ff; }
  .fwtop b { font-size: 18px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; } .fwtop span { color: #c9bff5; font-size: 14px; margin-right: auto; }
  .fwbar { height: 6px; border-radius: 3px; background: #ffffff22; overflow: hidden; } .fwbar i { display: block; height: 100%; width: 0; background: #5fd38f; transition: width .2s; }
  .fwtiles { display: flex; gap: 8px; align-items: flex-end; min-height: 74px; }
  .fwtiles:empty { display: none; }
  body.infollow .beatfly { top: 62px; transform: translateX(-50%) scale(.7); transform-origin: top center; }
  .fwtiles i { flex: 0 0 auto; font: 800 26px Fredoka, system-ui, sans-serif; font-style: normal; width: 52px; height: 52px; border-radius: 12px; display: grid; place-items: center;
    background: #ffffff1a; color: #ffffffb0; border: 2px solid #ffffff30; position: relative; }
  .fwtiles i.now { width: 72px; height: 72px; font-size: 38px; background: #ff7a59; color: #fff; border-color: #fff; box-shadow: 0 0 22px #ff7a5999; }
  .fwtiles i.lh { border-color: #3DA5FF; } .fwtiles i.now.lh { background: #3DA5FF; }
  .fwtiles sup { position: absolute; top: 2px; right: 4px; font-size: 13px; }
  .fwdone { font: 800 30px Fredoka, system-ui, sans-serif; color: #ffd86b; }
  #keys .want { background: linear-gradient(#ffe2a8, #ffb36b) !important; box-shadow: inset 0 -10px 0 #ff7a59, 0 0 18px #ffb36b; }
  #keys .bk.want { background: linear-gradient(#ff9d6b, #e9682a) !important; }
  #keys .want::after { content: ""; position: absolute; left: 50%; bottom: 18%; width: 18px; height: 18px; margin-left: -9px; border-radius: 50%; background: #e0503c; }
  #keys .wantx { animation: wantx .5s ease-out; }
  @keyframes wantx { 0% { filter: brightness(1.6); transform: translateY(3px); } 100% { filter: none; transform: none; } }
  /* Beat: the metronome in Piano only (js/metronome.js) */
  #beatBtn { display: none; }
  body.solo #beatBtn { display: block; }
  #beatBtn.on { background: linear-gradient(#ff9d4d, #e9682a); color: #fff; box-shadow: 0 3px 0 #8a3510; }
  #beatBtn.open { outline: 3px solid #ffd86b; }
  #beatBtn.pulse { animation: bpulse .18s ease-out; }
  @keyframes bpulse { 0% { transform: scale(1.14); } 100% { transform: scale(1); } }
  .beatfly { position: absolute; top: 12px; left: 50%; transform: translateX(-50%); display: none; align-items: center; gap: 16px; z-index: 2; }

  /* ===== Look (v1.11): a rounded kids' font (bundled, works offline), a soft night-sky background, chunky "candy" buttons ===== */
  @font-face { font-family: "Fredoka"; src: url("fonts/fredoka-latin.woff2") format("woff2"); font-weight: 300 700; font-display: swap; }

  /* Start screen */

  .gate .card { border-radius: 26px; background: linear-gradient(#2e2566, #241d52); border: 2px solid #ffffff12; }

  /* Phones held sideways (short screens): keep the lesson strip on the side, a compact header, no Back/Next row (the thumbnails do that) */
  @media (max-height: 500px) and (orientation: landscape) {

    ["1","2","3","4","5","6","7","8","9","Cancel","0","⌫"].forEach(function (k) {
      var b = document.createElement("button");
      b.textContent = k;
      if (k === "Cancel") onLang(function () { b.textContent = L("Cancel", "Cancelar"); });
      // Keys react on touch-down (not on the click after the finger lifts) and the 4th digit checks the PIN on the next
      // moment, once its dot is drawn: no OK button, the menu opens as soon as the right PIN is in.
      b.onpointerdown = function (e) {
        e.preventDefault();
        if (k === "Cancel") { closeGate(); return; }
        if (k === "⌫") { ans = ans.slice(0, -1); }
        else if (ans.length < 4) { ans += k; }
        $("ga").textContent = "•".repeat(ans.length);
        if (ans.length === 4) setTimeout(submit, 30);          // 30 ms: the 4th dot is drawn first (a frame callback could wait forever in the background)
      };
      pad.appendChild(b);
    });
  })();
</script>
<script>
  if (window.Voice && Voice.ttsInit) Voice.ttsInit();  // the speaking voices (questions, praise, explanations) work without Voice quiz
  autoFit(document.querySelector(".qcard")); autoFit(document.getElementById("qredIn")); autoFit(document.getElementById("tIn"));
  guard.start();                                     // a lock survives a restart
  appMode.boot();                                    // the start screen (or the mode the grown-up fixed)
  if (voice.cfg.on) setTimeout(voice.prepare, 1500); // loads the voice model (and asks for the microphone the first time)
</script>
