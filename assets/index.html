<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>Piano Lessons</title>
<style>
  :root {
    --bg: #14121f; --panel: #1e1b2e; --ink: #f4f1ff; --muted: #a39fbd;
    --accent: #f5b841; --accent-ink: #1e1b2e; --ring: #f5b841;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden;
    -webkit-user-select: none; user-select: none; }
  .app { display: grid; grid-template-columns: 1fr 300px; gap: 16px; height: 100%; padding: 16px; }
  .stage { display: flex; flex-direction: column; min-width: 0; min-height: 0; gap: 12px; }
  header { display: flex; align-items: center; gap: 10px; }
  header h1 { margin: 0; font-size: 22px; letter-spacing: .3px; }
  header .keys { width: 34px; height: 24px; border-radius: 5px;
    background: repeating-linear-gradient(90deg, #fff 0 7px, var(--bg) 7px 8.5px); }
  .player-wrap { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; }
  .player { position: relative; width: 100%; max-height: 100%; aspect-ratio: 16 / 9; border-radius: 14px;
    overflow: hidden; background: #000; }
  /* Our own screen over the player while paused/ended, so YouTube's "More videos" never shows */
  .cover { position: absolute; inset: 0; display: none; flex-direction: column; align-items: center;
    justify-content: center; gap: 14px; background: rgba(20,18,31,.94); z-index: 2; }
  .cover.on { display: flex; }
  .cover .big { border: 0; border-radius: 18px; background: var(--accent); color: var(--accent-ink);
    font-size: 30px; font-weight: 800; padding: 22px 44px; }
  .cover .sub { color: var(--muted); font-size: 18px; text-align: center; padding: 0 20px; }
  /* The iframe is 120px taller than the box and shifted up 60px: the video letterboxes inside it,
     so only black bars plus YouTube's edge overlays (title, "More videos") fall outside and are clipped. */
  .player iframe, #player { position: absolute; left: 0; top: -60px; width: 100%; height: calc(100% + 120px);
    border: 0; display: block; }
  .shield { position: absolute; inset: 0; z-index: 1; }   /* taps never reach YouTube's player */
  .controls { display: flex; align-items: center; gap: 12px; }
  .btn { flex: none; border: 0; border-radius: 14px; background: var(--accent); color: var(--accent-ink);
    font-size: 20px; font-weight: 700; padding: 16px 26px; min-width: 150px; }
  .btn:active { transform: scale(.97); }
  .btn[disabled] { opacity: .35; }
  .now { flex: 1; min-width: 0; text-align: center; }
  .now .n { color: var(--accent); font-weight: 700; font-size: 15px; }
  .now .t { font-size: 17px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  aside { background: var(--panel); border-radius: 14px; padding: 12px; overflow-y: auto; }
  aside h2 { margin: 2px 4px 10px; font-size: 15px; color: var(--muted); font-weight: 600; }
  .lesson { position: relative; display: block; width: 100%; border: 3px solid transparent; padding: 0;
    border-radius: 12px; overflow: hidden; margin-bottom: 10px; background: #000; aspect-ratio: 16 / 9; }
  .lesson img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .lesson .num { position: absolute; left: 8px; top: 8px; background: rgba(20,18,31,.85); color: var(--ink);
    font-weight: 700; font-size: 15px; border-radius: 8px; padding: 3px 9px; }
  .lesson.current { border-color: var(--ring); }
  .lesson.current .num { background: var(--accent); color: var(--accent-ink); }
  .msg { text-align: center; color: var(--muted); padding: 24px; font-size: 18px; }
  .msg button { margin-top: 14px; }
  /* grown-up exit */
  .gate { position: fixed; inset: 0; background: rgba(10,9,16,.92); display: none;
    align-items: center; justify-content: center; z-index: 10; }
  .gate.open { display: flex; }
  .gate .card { background: var(--panel); border-radius: 18px; padding: 24px; width: 340px; text-align: center; }
  /* Play along: keyboard under the video, narrow lesson strip, no Back/Next row */
  .piano { display: none; height: 36vh; min-height: 190px; gap: 8px; align-items: stretch; }
  body.play .piano { display: flex; }
  /* short video area: size the 16:9 box by height so the video is letterboxed, not cropped */
  /* Play along + Big video: the video fills the width and sits on the bottom edge, so the top is cut off and the
     lesson's keyboard (bottom of the video) lines up right above our piano. The iframe stays 120px taller than the
     16:9 video, so YouTube's edge overlays still fall in the clipped black bars. */
  body.play .player, body.big .player { width: 100%; height: 100%; max-width: 100%; aspect-ratio: auto; container-type: inline-size; }
  body.play .player iframe, body.play #player, body.big .player iframe, body.big #player { top: auto; bottom: -60px; height: calc(100cqw * 9 / 16 + 120px); }
  body.play .controls { display: none; }
  body.play .app { grid-template-columns: 1fr 150px; gap: 10px; padding: 8px 10px; }
  body.play .stage { gap: 8px; }
  body.play header .keys, body.play aside h2 { display: none; }
  body.play aside { padding: 6px; }
  body.play .lesson { margin-bottom: 6px; border-width: 2px; border-radius: 8px; }
  body.play .lesson .num { font-size: 12px; padding: 1px 6px; left: 4px; top: 4px; }
  .oct { flex: none; width: 46px; border: 0; border-radius: 12px; background: #2b2742; color: var(--ink); font-size: 20px; }
  .keys-row { position: relative; flex: 1; display: flex; touch-action: none; border-radius: 10px; overflow: hidden;
    background: #000; padding-top: 4px; }
  .wk { position: relative; flex: 1; margin: 0 1.5px; background: linear-gradient(#f4f1ea, #fffdf8 70%, #e9e4d8);
    border-radius: 0 0 8px 8px; display: flex; align-items: flex-end; justify-content: center; padding-bottom: 10px;
    color: #4a4560; font-weight: 700; font-size: 20px; }
  .bk { position: absolute; top: 4px; height: 60%; background: linear-gradient(#2b2836, #111018);
    border-radius: 0 0 6px 6px; z-index: 2; box-shadow: 0 3px 4px rgba(0,0,0,.5); }
  .wk.on { background: linear-gradient(#f5b841, #ffd77a); color: #1e1b2e; }
  .bk.on { background: linear-gradient(#c98a12, #f5b841); }
  .bk span { position: absolute; left: 0; right: 0; bottom: 7px; text-align: center; color: #cfc8f0; font-size: 12px; font-weight: 600; line-height: 1; pointer-events: none; }
  .bk.on span { color: #2a1c00; }
  #instPop .space { grid-column: 1 / -1; display: flex; align-items: center; gap: 10px; margin-top: 4px; padding-top: 12px; border-top: 1px solid #ffffff1a; }
  #instPop .space > span { color: var(--muted); font-size: 15px; white-space: nowrap; }
  #instPop .space button { flex: 1; padding: 10px 4px; font-size: 15px; }
  #instPop .space button b { display: inline; font-size: 20px; }
  .wk .c-oct { position: absolute; top: 8px; font-size: 12px; color: #a39fbd; font-weight: 600; }
  .vol { display: none; align-items: center; gap: 6px; color: var(--muted); font-size: 15px; margin-left: auto; }
  body.play .vol { display: flex; }
  body.play #playMode { margin-left: 0 !important; }
  #instBtn { display: none; }
  body.play #instBtn { display: block; }
  #instPop { position: fixed; inset: 0; z-index: 8; display: none; align-items: center; justify-content: center; background: rgba(10,8,20,.6); }
  #instPop.open { display: flex; }
  #instPop .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; background: var(--panel); padding: 18px; border-radius: 22px; width: min(640px, 94vw); max-height: 94vh; overflow-y: auto; }
  #instPop button { border: 3px solid transparent; border-radius: 16px; background: #2b2742; color: var(--ink); padding: 14px 4px; font: inherit; font-size: 15px; cursor: pointer; }
  #instPop button b { display: block; font-size: 38px; line-height: 1.2; font-weight: 400; }
  #instPop button.cur { border-color: var(--accent); background: #3a3459; }
  @media (max-width: 560px) { #instPop .grid { grid-template-columns: repeat(2, 1fr); } }
  .hint { color: var(--muted); font-size: 13px; white-space: nowrap; }
  body:not(.play) .hint { display: none !important; }
  .vol input { width: 130px; accent-color: var(--accent); }

  /* Big video mode: no Back/Next row, a narrow thumbnail strip, the video takes the room */
  body.big .app { grid-template-columns: 1fr 150px; gap: 10px; padding: 8px 10px; }
  body.big .stage { gap: 6px; }
  body.big .controls, body.big header .keys, body.big aside h2 { display: none; }
  body.big header h1 { font-size: 16px; color: var(--muted); }
  body.big aside { padding: 6px; }
  body.big .lesson { margin-bottom: 6px; border-width: 2px; border-radius: 8px; }
  body.big .lesson .num { font-size: 12px; padding: 1px 6px; left: 4px; top: 4px; }
  header .lock { border: 0; border-radius: 10px; background: #2b2742; color: var(--muted);
    font-size: 15px; padding: 8px 14px; }
  .gate .q { font-size: 22px; font-weight: 700; margin: 8px 0 14px; }
  .gate .ans { font-size: 34px; height: 46px; letter-spacing: 10px; color: var(--accent); }
  .gate .err { color: #ff8a80; height: 20px; font-size: 15px; }
  .gate .choices { display: grid; gap: 10px; margin-top: 8px; }
  .gate .choices button { font-size: 20px; padding: 14px; border: 0; border-radius: 12px; background: #2b2742; color: var(--ink); }
  .gate .choices .primary { background: var(--accent); color: var(--accent-ink); font-weight: 700; }
  .pad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 12px; }
  .pad button { font-size: 24px; padding: 14px 0; border: 0; border-radius: 12px; background: #2b2742; color: var(--ink); }
  .pad .wide { grid-column: span 2; }
  /* Math quiz between lessons: big pictures, big answers, made for a 5-year-old */
  .quiz { position: fixed; inset: 0; background: rgba(10,9,16,.96); display: none;
    align-items: center; justify-content: center; z-index: 9; }
  .quiz.open { display: flex; }
  .qcard { background: var(--panel); border-radius: 24px; padding: 16px 28px; width: min(900px, 94vw);
    text-align: center; flex: none; transform-origin: center; }   /* fitInto() scales it down to the screen, so nothing scrolls */
  .quiz.hinting .qpic, .quiz.hinting .qtitle, .quiz.hinting .qprog, .quiz.hinting .qstreak { display: none; }   /* room for the column hint */
  @media (max-width: 500px) { .qcard { padding: 14px 10px; } }
  .qtitle { color: var(--muted); font-size: 20px; }
  .qpic { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 4px 18px;
    min-height: 90px; margin: 10px 0 4px; }
  .qpic .grp { display: flex; flex-wrap: wrap; justify-content: center; gap: 2px; max-width: 46%; }
  .qpic .it { position: relative; line-height: 1.15; }
  .qpic .it.gone { opacity: .3; }
  .qpic .it.gone::after { content: "\2715"; position: absolute; inset: 0; color: #ff6b6b; font-weight: 900;
    display: flex; align-items: center; justify-content: center; }
  .qpic .op { font-size: 56px; font-weight: 900; color: var(--accent); }
  .qeq { font-size: 54px; font-weight: 900; letter-spacing: 4px; margin: 2px 0 10px; }
  .qeq [data-r="q"].got { display: inline-block; color: #5ee6a0; border-color: #5ee6a0; animation: pop .5s ease-out; }
  .qyay { font-size: 46px; font-weight: 900; color: #5ee6a0; animation: pop .5s ease-out; }
  .confetti { position: fixed; inset: 0; pointer-events: none; z-index: 11; overflow: hidden; }
  .confetti i { position: absolute; top: -24px; width: 12px; height: 18px; border-radius: 3px; }
  .qans { display: flex; justify-content: center; gap: 22px; }
  .qans button { width: 120px; height: 96px; border: 0; border-radius: 22px; font-size: 50px; font-weight: 900;
    color: var(--accent-ink); background: #8fd3ff; box-shadow: 0 6px 0 rgba(0,0,0,.35); }
  .qans button:nth-child(2) { background: #b6f09c; }
  .qans button:nth-child(3) { background: #ffc4e1; }
  .qans button:active { transform: translateY(4px); box-shadow: 0 2px 0 rgba(0,0,0,.35); }
  .qans button[disabled] { opacity: .45; }
  .qans button.yes { background: var(--accent); transform: scale(1.12); }
  .qmsg { min-height: 30px; margin-top: 12px; font-size: 24px; font-weight: 700; }
  .qcheer { font-size: 72px; animation: pop .6s ease-out; }
  .qpic:empty { display: none; }
  .qprog { font-size: 26px; font-weight: 800; color: var(--accent); margin-top: 6px; }
  .qprog:empty { display: none; }
  /* Written column arithmetic (levels 4-6): digits right-aligned, ones under ones, tens under tens */
  .vcol { display: inline-grid; grid-template-columns: auto auto; column-gap: .3em; text-align: right; line-height: 1.12;
    font-family: ui-monospace, "Roboto Mono", "Courier New", monospace; font-variant-numeric: tabular-nums; font-weight: 900; letter-spacing: 0; }
  .vcol .n { grid-column: 2; justify-self: end; }
  .vcol .op { grid-column: 1; color: var(--accent); text-align: center; }
  .vcol .ln { grid-column: 1 / 3; height: .08em; margin: .06em 0; background: currentColor; border-radius: 2px; }
  .vcol .bx { border: .05em dashed var(--accent); border-radius: .14em; color: var(--accent); text-align: center; box-sizing: content-box; }
  .qred .eq .vcol .bx { color: #fff; border-color: #fff; }
  /* Voice quiz: read the question aloud and say the answer */
  .qvoice { margin-top: 6px; }
  .qvoice .mic { font-size: 84px; line-height: 1.1; animation: pulse 1.2s ease-in-out infinite alternate; }
  .qvoice .say { font-size: 30px; font-weight: 800; color: var(--accent); }
  .qvoice .heard { min-height: 24px; margin-top: 6px; font-size: 16px; color: var(--muted); }
  @keyframes pulse { from { transform: scale(1); } to { transform: scale(1.14); } }
  .gate .note { color: var(--muted); font-size: 14px; min-height: 0; margin: -2px 4px 0; }
  .gate .note:empty { display: none; }
  /* Math-only mode: no video, no piano; the quiz fills the screen and only the Menu button remains */
  body.math .stage > :not(header), body.math aside { display: none !important; }
  body.math header > :not(#lock):not(#homeBtn) { display: none !important; }
  body.math #lock, body.athome #lock { position: fixed; top: 12px; right: 14px; z-index: 10; }
  body.math #homeBtn { position: fixed; top: 12px; left: 14px; z-index: 10; }
  body.fixedStart #homeBtn, body.athome #homeBtn { display: none !important; }
  /* Start screen: he picks what to do */
  .home { position: fixed; inset: 0; z-index: 8; display: none; flex-direction: column; align-items: center; justify-content: center;
    gap: 5vh; background: var(--bg); padding: 16px; text-align: center; }
  .home.on { display: flex; }
  .home h1 { margin: 0; font-size: clamp(24px, 7vh, 50px); }
  .home .opts { display: flex; gap: 5vw; justify-content: center; }
  .home .opts button { width: min(38vw, 340px, 68vh); aspect-ratio: 1.1; border: 0; border-radius: 28px; font: inherit; font-weight: 800;
    font-size: clamp(18px, 5vh, 36px); color: var(--accent-ink); box-shadow: 0 8px 0 rgba(0,0,0,.35);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2vh; }
  .home .opts button b { font-size: clamp(48px, 18vh, 130px); line-height: 1; font-weight: 400; }
  .home .opts button:active { transform: translateY(5px); box-shadow: 0 3px 0 rgba(0,0,0,.35); }
  #homePiano { background: #8fd3ff; } #homeMath { background: #b6f09c; }
  /* Mistake: the whole screen goes red and freezes for a few seconds */
  .qred { position: fixed; inset: 0; z-index: 12; display: none; flex-direction: column; align-items: center;
    justify-content: center; gap: 14px; background: #c4001a; color: #fff; text-align: center; overflow: hidden;
    animation: flash 1s ease-in-out infinite alternate; }
  .qin { display: flex; flex-direction: column; align-items: center; gap: inherit; flex: none; transform-origin: center; }
  .qred .steps > div.st { transition: opacity .35s, transform .35s, color .35s; }
  .qred .steps > div.st.dim { opacity: .22; }
  .qred .steps > div.st.now { color: #ffe27a; transform: scale(1.06); }
  .qred.calm .steps > div.st.now { color: #fff; }
  .qred.on { display: flex; }
  .qred .stop { font-size: 60px; font-weight: 900; }
  .qred .eq { font-size: 58px; font-weight: 900; background: rgba(0,0,0,.3); border-radius: 22px; padding: 8px 34px; }
  .qred .cnt { font-size: 44px; font-weight: 800; }
  @keyframes flash { from { background: #a80016; } to { background: #e0102a; } }
  .qred .steps { font-size: 28px; font-weight: 800; line-height: 1.35; background: rgba(0,0,0,.2); border-radius: 18px; padding: 8px 28px; max-width: 92vw; }
  .qred .steps:empty, .qred .dots:empty { display: none; }
  .qred .dots i { font-style: normal; font-size: 30px; margin: 0 3px; }
  .qred .dots i.n { color: #ffe27a; } .qred .dots i.x { opacity: .35; } .qred .dots i.g { margin-right: 22px; }
  .qred .leg { font-size: 26px; } .qred .leg i { font-style: normal; font-weight: 900; }
  .qred .leg i.t { color: #ffe27a; } .qred .leg i.o { color: #8ff0ff; }
  .qred.ex { gap: 8px; }
  .qred.ex .stop { font-size: 38px; } .qred.ex .eq { font-size: 48px; } .qred.ex .cnt { font-size: 34px; }
  .qred.calm { background: #5c6475; animation: none; }
  .vcol i { font-style: normal; } .vcol i.t { color: #ffe27a; } .vcol i.o { color: #8ff0ff; }
  /* Arcs between digits: hints, mini-lessons and explanations share one drawing engine */
  .qhost { position: relative; display: inline-block; }
  .qhost i { font-style: normal; }
  .qhost.hint { margin-top: 100px; }
  .arcs { position: absolute; left: 0; top: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none; }
  .arcs path { fill: none; stroke: var(--arc, #ff4d6d); stroke-width: 5; stroke-linecap: round; }
  .arcs .old { opacity: .4; }
  .arcs .chip { fill: #ffe27a; }
  .arcs text { font: 900 24px system-ui, sans-serif; fill: #14121f; text-anchor: middle; dominant-baseline: central; }
  .arcs .pop { animation: pop .45s ease-out .5s both; transform-box: fill-box; transform-origin: center; }
  [data-r].hl { color: var(--arc, #ff4d6d); }
  .qhost .pop { display: inline-block; animation: pop .5s ease-out; }
  .qred { --arc: #fff; } .qred .arcs .chip { fill: #fff; }
  .qtbtn { margin-top: 10px; font-size: 20px; font-weight: 800; padding: 10px 22px; border: 0; border-radius: 16px; background: #2b2742; color: var(--ink); }
  /* Column hints (colHint): lanes, flying digits, blocks, the keypad of "do it with me" */
  .chint[hidden] { display: none; }
  .chint { margin: 0 auto 6px; width: 340px; max-width: 100%; }
  .ch-stage { position: relative; height: 330px; overflow: hidden; border-radius: 18px; background: #1b1930; }
  .ch-stage.blocks { height: 410px; }
  .ch-lane { position: absolute; top: 0; bottom: 0; width: 60px; border-radius: 16px; background: #ffffff08; transition: background .4s, box-shadow .4s; }
  .ch-lane span { position: absolute; bottom: 6px; width: 100%; text-align: center; font-size: 12px; font-weight: 700; opacity: .8; }
  .ch-lane.o span { color: #ff5a7a; } .ch-lane.t span { color: #4cc9ff; }
  .ch-lane.o.live { background: #ff5a7a22; box-shadow: 0 0 30px #ff5a7a44 inset; }
  .ch-lane.t.live { background: #4cc9ff22; box-shadow: 0 0 30px #4cc9ff44 inset; }
  .ch-bar { position: absolute; height: 6px; border-radius: 3px; background: var(--ink); top: 222px; }
  .ch-tok, .ch-cube, .ch-stick, .ch-flash, .ch-spark { position: absolute; left: 0; top: 0; will-change: transform; }
  .ch-tok { font: 800 72px/1 ui-monospace, "Roboto Mono", "Courier New", monospace; white-space: nowrap; }
  .ch-tok.o { color: #ff5a7a; } .ch-tok.t { color: #4cc9ff; } .ch-tok.g { color: #ffd23f; text-shadow: 0 0 18px #ffd23f88; }
  .ch-tok.m { color: var(--muted); } .ch-tok.q { color: #ffffff30; } .ch-tok.small { font-size: 40px; } .ch-tok.used { opacity: .35; }
  .ch-tok.struck { text-decoration: line-through; text-decoration-color: #ffd23f; text-decoration-thickness: 7px; }
  .ch-tok.res { color: #5ee6a0; text-shadow: 0 0 22px #5ee6a099; }
  .ch-tok small { font-size: .55em; color: #ffd23f; vertical-align: .55em; }
  .ch-cube { width: 10px; height: 10px; border-radius: 2px; background: #ff5a7a; } .ch-cube.b { background: #ffb3c1; } .ch-cube.g { background: #ffd23f; }
  .ch-stick { width: 5px; height: 50px; border-radius: 2px; background: repeating-linear-gradient(#4cc9ff 0 4px, #1b1930 4px 5px); }
  .ch-stick.b { background: repeating-linear-gradient(#a8e6ff 0 4px, #1b1930 4px 5px); } .ch-stick.g { background: repeating-linear-gradient(#ffd23f 0 4px, #1b1930 4px 5px); }
  .ch-flash { z-index: 5; width: 48px; height: 48px; display: flex; align-items: center; justify-content: center; border-radius: 50%;
    background: #14131fdd; box-shadow: 0 0 24px #ffd23f99; font: 900 40px/1 system-ui, sans-serif; color: #ffd23f; }
  .ch-spark { width: 10px; height: 10px; border-radius: 50%; }
  .ch-say { min-height: 2.8em; margin: 8px 4px 2px; font-size: 22px; font-weight: 800; line-height: 1.3; }
  .ch-say b.o { color: #ff5a7a; } .ch-say b.t { color: #4cc9ff; } .ch-say b.g { color: #ffd23f; } .ch-say b.r { color: #5ee6a0; }
  .ch-pad { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; margin: 4px 0; }
  .ch-pad[hidden] { display: none; }
  .ch-pad button { padding: 10px 0; font-size: 24px; font-weight: 800; border: 0; border-radius: 12px; background: #2b2742; color: var(--ink); }
  .ch-pad .ok { background: #2f9e6b; }
  .ch-entry { grid-column: 1 / -1; text-align: center; font: 800 34px ui-monospace, monospace; min-height: 42px; color: #ffd23f; }
  .vcol i.nudge { display: inline-block; color: #ff5a7a !important; animation: nudge .8s ease-in-out infinite alternate; }
  @keyframes nudge { to { transform: translateY(-10px) scale(1.15); } }
  .qred .slip { font-size: 26px; color: #ffe27a; margin-bottom: 6px; }
  .qtrick { position: absolute; inset: 0; z-index: 2; display: none; flex-direction: column; align-items: center; justify-content: center;
    gap: 14px; background: var(--bg); text-align: center; padding: 20px; }
  .qtrick.on { display: flex; }
  .qtrick { overflow: hidden; }
  .qtrick .tname { font-size: 38px; font-weight: 900; color: var(--accent); }
  .qtrick .eq { font-size: 76px; font-weight: 900; }
  .qtrick .tcap { font-size: 32px; font-weight: 800; min-height: 80px; max-width: 90vw; }
  .qtrick .tskip { position: absolute; right: 22px; bottom: 18px; font-size: 22px; padding: 12px 22px; border: 0; border-radius: 14px; background: #2b2742; color: var(--ink); }
  .qrow { display: flex; align-items: center; justify-content: center; gap: 24px; }
  .qrep { flex: none; width: 84px; height: 84px; border: 0; border-radius: 50%; font-size: 44px; background: #2b2742; color: var(--ink); }
  .qrep:active { transform: scale(.92); }
  .qstreak { font-size: 30px; letter-spacing: 6px; min-height: 36px; }
  .qstreak:empty { display: none; }
  /* Hearts: a wrong answer breaks one, 5 right in a row win one back */
  .hearts { font-size: 34px; letter-spacing: 4px; min-height: 40px; }
  .hearts:empty { display: none; }
  .hearts i { font-style: normal; display: inline-block; }
  .hearts i.off { filter: grayscale(1); opacity: .3; }
  .hearts i.lost { animation: hlost 1.4s ease-out; }
  .hearts i.won { animation: hwon 1s ease-out; }
  @keyframes hlost { 0% { filter: none; opacity: 1; transform: scale(1.5); } 30% { transform: scale(1.5) rotate(-18deg); } 50% { transform: scale(1.3) rotate(18deg); } 100% { filter: grayscale(1); opacity: .3; transform: none; } }
  @keyframes hwon { 0% { transform: scale(0); } 60% { transform: scale(1.7); } 100% { transform: scale(1); } }
  .quiz.hinting .hearts { display: none; }
  /* Limits: the lock screen covers everything but the Menu button; the earn session shows the quiz instead */
  .lockscr { position: fixed; inset: 0; z-index: 9; display: none; flex-direction: column; align-items: center; justify-content: center;
    gap: 16px; background: #1b2440; color: #fff; text-align: center; padding: 24px; }
  body.locked .lockscr { display: flex; } body.locked.earning .lockscr { display: none; }
  .lockscr .big { font-size: 110px; line-height: 1; } .lockscr .msg { font-size: 50px; font-weight: 800; } .lockscr .sub { font-size: 28px; color: #c7d0f0; }
  .lockscr button { margin-top: 12px; font-size: 28px; font-weight: 800; padding: 18px 34px; border: 0; border-radius: 18px; background: var(--accent); color: var(--accent-ink); }
  body.locked header > :not(#lock) { display: none !important; }
  body.locked #lock { position: fixed; top: 12px; right: 14px; z-index: 10; }
  .tbanner { position: fixed; top: 12px; left: 50%; transform: translateX(-50%); z-index: 12; background: #ffd166; color: #14121f;
    font-weight: 800; font-size: 22px; padding: 8px 20px; border-radius: 14px; display: none; }
  .tbanner.on { display: block; }
  .gate .card { max-height: 94vh; overflow-y: auto; }
  #res, #act { z-index: 11; }
  /* Eye guard: too close to the screen -> cover everything until he moves back */
  .eyecov { position: fixed; inset: 0; z-index: 13; display: none; flex-direction: column; align-items: center;
    justify-content: center; gap: 18px; background: #14121f; color: #fff; text-align: center; padding: 24px; }
  .eyecov.on { display: flex; }
  .eyecov .big { font-size: 110px; line-height: 1; }
  .eyecov .msg { font-size: 54px; font-weight: 800; }
  .eyecov .sub { font-size: 26px; color: var(--muted); }
  #res .card, #act .card { width: min(600px, 94vw); text-align: left; }
  #res h3, #act h3 { margin: 0 0 8px; text-align: center; }
  #act .tabs { display: flex; gap: 6px; margin-bottom: 8px; }
  #act .tabs button { flex: 1; font-size: 15px; padding: 10px 4px; border: 0; border-radius: 10px; background: #2b2742; color: var(--ink); }
  #act .tabs button.on { background: var(--accent); color: var(--accent-ink); font-weight: 700; }
  #act .bar { display: flex; align-items: center; gap: 8px; padding: 4px 0; font-size: 16px; }
  #act .bar i { flex: none; width: 64px; font-style: normal; color: var(--muted); }
  #act .bar span { flex: 1; height: 16px; background: #2b2742; border-radius: 8px; overflow: hidden; }
  #act .bar span b { display: block; height: 100%; background: var(--accent); border-radius: 8px; }
  #act .bar em { flex: none; width: 64px; text-align: right; font-style: normal; }
  #act .sub { margin-top: 10px; color: var(--muted); }
  #act .miss b { color: #ff8a80; }
  #act .row {
    display: flex; justify-content: space-between; gap: 10px; padding: 6px 0; font-size: 17px; border-bottom: 1px solid #2b2742; }
  #act .miss { font-size: 15px; color: var(--muted); }
  #act .list { max-height: 44vh; overflow-y: auto; margin-top: 6px; }
  #res .row { display: flex; justify-content: space-between; gap: 10px; padding: 6px 0; font-size: 18px;
    border-bottom: 1px solid #2b2742; }
  #res .miss { font-size: 15px; color: var(--muted); }
  #res .miss b { color: #ff8a80; }
  #res .list { max-height: 34vh; overflow-y: auto; margin-top: 6px; }
  @keyframes pop { 0% { transform: scale(.3); } 70% { transform: scale(1.2); } 100% { transform: scale(1); } }
  .gate .set { font-size: 17px !important; }
  @media (max-width: 800px) {
    .app { grid-template-columns: 1fr; grid-template-rows: 1fr 140px; }
    aside { display: flex; gap: 10px; overflow-x: auto; overflow-y: hidden; }
    aside h2 { display: none; }
    .lesson { width: 190px; flex: none; margin: 0; }
    .btn { min-width: 0; padding: 14px 18px; }
  }
  /* ===== Look (v1.11): a rounded kids' font (bundled, works offline), a soft night-sky background, chunky "candy" buttons ===== */
  @font-face { font-family: "Fredoka"; src: url("fonts/fredoka-latin.woff2") format("woff2"); font-weight: 300 700; font-display: swap; }
  :root { --bg: #17123a; --panel: #251d52; --panel2: #2e2563; --ink: #fbf8ff; --muted: #b3acd9; --accent: #ffc83d; --accent-ink: #2a1c00; --ring: #ffc83d; }
  html, body { font-family: "Fredoka", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  body { background: radial-gradient(ellipse at 12% 8%, #3d2c8d 0, transparent 46%), radial-gradient(ellipse at 90% 95%, #134a7c 0, transparent 50%), var(--bg); }
  button { font-family: inherit; }
  header h1 { font-weight: 700; font-size: 24px; background: linear-gradient(90deg, #ffd86b, #ff8fb1 55%, #8fd3ff); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .btn { border-radius: 999px; font-weight: 700; background: linear-gradient(#ffdb6e, #ffb21e); box-shadow: 0 5px 0 #c77d00, inset 0 2px 0 rgba(255,255,255,.55); }
  .btn:active { transform: translateY(4px); box-shadow: 0 1px 0 #c77d00, inset 0 2px 0 rgba(255,255,255,.55); }
  header .lock { border-radius: 999px; background: linear-gradient(#41357c, #332a66); color: var(--ink); font-weight: 600; box-shadow: 0 4px 0 #1b1540; }
  header .lock:active { transform: translateY(3px); box-shadow: 0 1px 0 #1b1540; }
  #homeBtn { font-size: 20px; padding: 6px 14px; }
  header .lock { white-space: nowrap; font-size: 14px; padding: 6px 12px; box-shadow: 0 3px 0 #1b1540; }
  header .lock:active { box-shadow: 0 1px 0 #1b1540; }
  header { gap: 8px; } header h1 { font-size: 20px; }
  #homeBtn { font-size: 16px; padding: 5px 11px; }
  .vol { font-size: 13px; } .vol input { width: 100px; }
  /* Octave arrows: slim and quiet, so the keys get the room */
  .oct { width: 30px; border-radius: 12px; font-size: 14px; color: var(--muted); background: #2c2460; box-shadow: none; border: 1px solid #ffffff14; }
  .oct:active { background: #3d3380; color: var(--ink); }
  .piano { gap: 6px; }
  body.play header h1, body.big header h1 { display: none; }   /* room for the buttons on one line */
  aside { background: linear-gradient(#271f57, #211a4a); border: 2px solid #ffffff0d; border-radius: 22px; }
  .lesson { border-radius: 16px; box-shadow: 0 4px 0 #0f0b28; }
  .lesson .num { border-radius: 999px; }
  .player { border-radius: 22px; box-shadow: 0 10px 30px #0008; }
  .cover { background: radial-gradient(circle at 50% 40%, #3a2d86ee, #17123af2); }
  .cover .big { border-radius: 999px; background: linear-gradient(#ffdb6e, #ffb21e); box-shadow: 0 6px 0 #c77d00, inset 0 2px 0 #fff8; }
  .oct { border-radius: 16px; background: linear-gradient(#41357c, #332a66); box-shadow: 0 4px 0 #1b1540; }
  .wk.on { background: linear-gradient(#ffc83d, #ffe08a); }

  /* Start screen */
  .home { background: radial-gradient(ellipse at 15% 10%, #4a35a8 0, transparent 50%), radial-gradient(ellipse at 85% 100%, #155f93 0, transparent 55%), var(--bg); overflow: hidden; }
  .home::before { content: ""; position: absolute; inset: 0; pointer-events: none; opacity: .55;
    background-image: radial-gradient(#fff 1.2px, transparent 1.6px), radial-gradient(#ffd86b 1.4px, transparent 1.8px);
    background-size: 90px 90px, 140px 140px; background-position: 10px 20px, 60px 80px; animation: twinkle 6s ease-in-out infinite alternate; }
  @keyframes twinkle { to { opacity: .25; } }
  .home h1 { position: relative; font-weight: 700; background: linear-gradient(90deg, #ffd86b, #ff8fb1 50%, #8fd3ff); -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 3px 0 #0006); }
  .home .opts { position: relative; }
  .home .opts button { border-radius: 36px; color: #fff; text-shadow: 0 2px 0 #0004; font-weight: 700; padding: 3vh 2vw 2vh;
    box-shadow: 0 10px 0 var(--edge), 0 18px 30px #0007, inset 0 3px 0 #fff6; animation: float 3.2s ease-in-out infinite; }
  .home .opts button:nth-child(2) { animation-delay: -1.6s; }
  .home .opts button:active { animation: none; transform: translateY(8px); box-shadow: 0 2px 0 var(--edge), inset 0 3px 0 #fff6; }
  @keyframes float { 50% { transform: translateY(-10px) rotate(-.6deg); } }
  #homePiano { --edge: #2a5cc7; background: linear-gradient(160deg, #6fd0ff, #5b7cff 70%); }
  #homeMath { --edge: #1f9a6a; background: linear-gradient(160deg, #a6f27a, #25c08a 70%); }
  .home .art { width: 78%; max-height: 60%; display: block; filter: drop-shadow(0 6px 0 #0003); }
  .home .art text { font-family: "Fredoka", sans-serif; font-weight: 700; }
  .home .art .note { animation: bob 2.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
  .home .art .note.n2 { animation-delay: -1.2s; }
  .home .art .star { animation: spin 7s linear infinite; transform-box: fill-box; transform-origin: center; }
  @keyframes bob { 50% { transform: translateY(-7px) rotate(8deg); } }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Quiz */
  .quiz { background: radial-gradient(ellipse at 20% 0%, #3d2c8d 0, transparent 50%), radial-gradient(ellipse at 80% 100%, #134a7c 0, transparent 55%), #140f33f5; }
  .qcard { background: linear-gradient(#2e2566, #241d52); border: 3px solid #ffffff12; border-radius: 34px; box-shadow: 0 16px 40px #0008, inset 0 2px 0 #ffffff14; }
  .qtitle { font-weight: 600; }
  .qeq { font-weight: 700; }
  .qans button { border-radius: 26px; font-weight: 700; color: #fff; text-shadow: 0 3px 0 #0003;
    background: linear-gradient(#7fd4ff, #3e9bff); box-shadow: 0 7px 0 #2367c9, inset 0 3px 0 #fff7; }
  .qans button:nth-child(2) { background: linear-gradient(#b9f47e, #4cc95d); box-shadow: 0 7px 0 #2c8a3a, inset 0 3px 0 #fff7; }
  .qans button:nth-child(3) { background: linear-gradient(#ffb0d6, #ff6fa8); box-shadow: 0 7px 0 #c23f78, inset 0 3px 0 #fff7; }
  .qans button:active { transform: translateY(5px); box-shadow: 0 2px 0 #0005, inset 0 3px 0 #fff7; }
  .qans button.yes { background: linear-gradient(#ffe07a, #ffb21e); box-shadow: 0 7px 0 #c77d00, 0 0 0 6px #ffffff33, inset 0 3px 0 #fff8; transform: scale(1.12); }
  .qtbtn, .qrep { background: linear-gradient(#41357c, #332a66); box-shadow: 0 4px 0 #1b1540; color: var(--ink); }
  .qtbtn { border-radius: 999px; font-weight: 600; }
  .qyay { font-weight: 700; background: linear-gradient(90deg, #ffe07a, #7dffb5, #8fd3ff); -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 3px 0 #0005); }
  .qred { background: radial-gradient(ellipse at 50% 30%, #ff4d5e, #c3102a 70%); animation: none; }
  .qred .eq { border-radius: 28px; background: #0003; box-shadow: inset 0 3px 0 #0002; }
  .qred .steps { border-radius: 24px; background: #0002; }
  .qred .stop { font-weight: 700; text-shadow: 0 4px 0 #0003; }
  .qred.calm { background: radial-gradient(ellipse at 50% 30%, #6f7894, #4c5470 70%); }
  .qtrick { background: radial-gradient(ellipse at 50% 20%, #3d2c8d, #17123a 70%); }
  .qtrick .tskip { border-radius: 999px; background: linear-gradient(#41357c, #332a66); box-shadow: 0 4px 0 #1b1540; }
  .lockscr { background: radial-gradient(ellipse at 50% 30%, #2f4a96, #18224a 75%); }
  .lockscr button { border-radius: 999px; background: linear-gradient(#ffdb6e, #ffb21e); box-shadow: 0 6px 0 #c77d00, inset 0 2px 0 #fff8; }
  .gate .card { border-radius: 26px; background: linear-gradient(#2e2566, #241d52); border: 2px solid #ffffff12; }
  .pad button, .gate .choices button { border-radius: 16px; background: #3a2f72; }
  #instPop .grid { border-radius: 28px; background: linear-gradient(#2e2566, #241d52); }
  #instPop button { border-radius: 20px; background: #3a2f72; box-shadow: 0 4px 0 #1b1540; }
  /* Phones held sideways (short screens): keep the lesson strip on the side, a compact header, no Back/Next row (the thumbnails do that) */
  @media (max-height: 500px) and (orientation: landscape) {
    .app { grid-template-columns: 1fr 140px; grid-template-rows: none; gap: 8px; padding: 6px 8px; }
    aside { display: block; overflow-y: auto; overflow-x: hidden; padding: 6px; }
    aside h2 { display: none; }
    .lesson { width: 100%; margin: 0 0 6px; border-width: 2px; border-radius: 10px; }
    .lesson .num { font-size: 12px; padding: 1px 6px; left: 4px; top: 4px; }
    .controls { display: none; }
    .stage { gap: 6px; }
    header { gap: 6px; }
    header h1 { font-size: 16px; } header .keys { display: none; }
    header .lock { padding: 6px 10px; font-size: 13px; }
    .piano { height: 44vh; min-height: 120px; }
    .oct { width: 26px; }
    .wk { font-size: 14px; padding-bottom: 6px; }
  }
</style>
</head>
<body>
<div id="instPop"><div class="grid" id="instGrid"></div></div>
<div class="app">
  <section class="stage">
    <header id="title"><span class="keys" aria-hidden="true"></span><h1 id="appTitle">Piano Lessons</h1>
      <label class="vol" id="volBox">&#127916; <input type="range" id="vol" min="0" max="100" value="50"></label>
      <button class="lock" id="instBtn" aria-label="Choose the piano sound"></button>

<div class="lockscr" id="lockscr"><div class="big" id="lkIcon"></div><div class="msg" id="lkMsg"></div><div class="sub" id="lkSub"></div><button id="lkEarn" hidden></button></div>
<div class="tbanner" id="tbanner"></div>

<div class="home" id="home"><h1 id="homeHi"></h1><div class="opts">
  <button id="homePiano"><svg class="art" viewBox="0 0 200 140" aria-hidden="true">
      <g class="note"><ellipse cx="52" cy="40" rx="11" ry="8" fill="#ffd86b" transform="rotate(-20 52 40)"/><rect x="60" y="6" width="5" height="34" rx="2" fill="#ffd86b"/><path d="M62 6 q18 4 16 20 q-4-10-16-10z" fill="#ffd86b"/></g>
      <g class="note n2"><ellipse cx="138" cy="34" rx="10" ry="7" fill="#ff8fb1" transform="rotate(-20 138 34)"/><ellipse cx="170" cy="26" rx="10" ry="7" fill="#ff8fb1" transform="rotate(-20 170 26)"/><rect x="145" y="4" width="4.5" height="30" rx="2" fill="#ff8fb1"/><rect x="176" y="-4" width="4.5" height="30" rx="2" fill="#ff8fb1"/><rect x="145" y="-4" width="35" height="7" rx="3" fill="#ff8fb1" transform="rotate(-12 147 0)"/></g>
      <rect x="10" y="56" width="180" height="80" rx="16" fill="#2b2160"/><rect x="10" y="56" width="180" height="14" rx="7" fill="#ff6fa8"/>
      <g fill="#fff"><rect x="18" y="72" width="22" height="58" rx="6"/><rect x="42" y="72" width="22" height="58" rx="6"/><rect x="66" y="72" width="22" height="58" rx="6"/><rect x="90" y="72" width="22" height="58" rx="6"/><rect x="114" y="72" width="22" height="58" rx="6"/><rect x="138" y="72" width="22" height="58" rx="6"/><rect x="162" y="72" width="22" height="58" rx="6"/></g>

    var $ = function (id) { return document.getElementById(id); };
    var bridge = window.Parent;

    function show(prompt) {
      ans = ""; $("ga").textContent = ""; $("gq").textContent = prompt;
      pad.hidden = false; choices.hidden = true; choices.textContent = "";
    }
    // Unlocked only in memory, only while the menu is open; 60 s without a touch locks it again
    var idleTimer = null;
    function armIdle() { clearTimeout(idleTimer); idleTimer = setTimeout(lock, 60000); }
    function unlock() {
      pad.hidden = true; choices.textContent = "";
      choices.appendChild($("menuTpl").content.cloneNode(true));
      choices.hidden = false; bindMenu(); armIdle();
    }
    function lock() {
      clearTimeout(idleTimer); idleTimer = null;
      choices.textContent = ""; choices.hidden = true; pad.hidden = false; ans = ""; $("ga").textContent = "";
      gate.classList.remove("open"); $("act").classList.remove("open"); $("res").classList.remove("open");
      eye.menu(false);
    }
    window.lockMenu = lock;
    ["gate", "act", "res"].forEach(function (id) {
      $(id).addEventListener("pointerdown", function (e) {
        if (e.target === $(id)) { lock(); return; }          // a tap outside the card closes (and locks) the menu
        if (idleTimer) armIdle();
      });
    });
    document.addEventListener("visibilitychange", function () { if (document.hidden) lock(); });
    window.addEventListener("pagehide", lock);
    function open() {
      $("ge").textContent = "";
      $("gFor").textContent = L("For grown-ups", "Para adultos");
      if (bridge && !bridge.hasPin()) { mode = "new"; show(L("Create a 4-digit PIN", "Crea un PIN de 4 números")); }
      else { mode = "check"; show(L("Enter the grown-up PIN", "Escribe el PIN de adulto")); }
      gate.classList.add("open"); eye.menu(true);          // the camera rests while the grown-up menu is open
    }
    function closeGate() { lock(); }

    function submit() {
      if (ans.length !== 4) return;
      if (mode === "check") {
        if (Date.now() < lockedUntil) { $("ge").textContent = L("Too many tries, wait a minute", "Demasiados intentos, espera un minuto"); show(L("Enter the grown-up PIN", "Escribe el PIN de adulto")); return; }
        if (bridge && bridge.checkPin(ans)) {
          fails = 0; $("ge").textContent = ""; unlock();
          $("gq").textContent = L("Unlocked", "Desbloqueado"); $("ga").textContent = "";
        } else {
          if (++fails >= 3) { lockedUntil = Date.now() + 60000; fails = 0; }
          $("ge").textContent = L("Wrong PIN", "PIN incorrecto"); show(L("Enter the grown-up PIN", "Escribe el PIN de adulto"));
        }
      } else if (mode === "new") {
        first = ans; mode = "confirm"; $("ge").textContent = ""; show(L("Type the same PIN again", "Escribe el mismo PIN otra vez"));
      } else if (mode === "confirm") {
        if (ans === first) { bridge.setPin(ans); $("ge").textContent = ""; closeGate(); }
        else { mode = "new"; $("ge").textContent = L("The PINs didn't match", "Los PIN no coinciden"); show(L("Create a 4-digit PIN", "Crea un PIN de 4 números")); }
      }
    }

    // The menu content exists only while unlocked; its handlers are bound each time it is cloned in
    function bindMenu() {
    // Quiz settings, behind the PIN; each tap cycles to the next choice
    function label() {
      var c = quiz.cfg;
      $("qOn").textContent = "Math quiz: " + (c.on ? "ON" : "OFF");
      $("qEvery").textContent = "Quiz after every " + c.every + " lesson" + (c.every > 1 ? "s" : "");
      $("qNeed").textContent = "Correct answers needed: " + c.need;
      $("qLevel").textContent = "Level: " + c.level + " (tap to change)";
      $("qEvery").disabled = $("qNeed").disabled = $("qLevel").disabled = !c.on;
    }
    function vlabel() {
      if (!$("vOn")) return;                    // the menu is not rendered while locked
      $("vRead").textContent = "\ud83d\udd0a Read questions aloud: " + (voice.cfg.read ? "ON" : "OFF");
      $("vFb").textContent = "\ud83d\udde3\ufe0f Spoken feedback: " + (voice.cfg.fb ? "ON" : "OFF");
      $("vLang").textContent = "\ud83c\udf10 Language: " + (voice.cfg.lang === "es" ? "Espa\u00f1ol" : "English");
      $("vOn").textContent = "\ud83c\udfa4 Voice quiz (answer by voice): " + (voice.cfg.on ? "ON" : "OFF");
      $("vNote").textContent = voice.note();
    }
    function mlabel() {
      $("qMode").textContent = "Start screen: " + { choose: "🏠 he chooses", piano: "🎹 Piano lessons", math: "➗ Math only" }[appMode.startMode()] + " (tap to change)";
      $("qTry").disabled = appMode.math();
    }
    function elabel() {
      if (!$("eOn")) return;
      var st = eye.state();
      $("eOn").textContent = "Eye guard: " + (eye.cfg.on ? "ON" : "OFF") + (eye.cfg.on && st === "noperm" ? " (tap to allow the camera)" : "");
      $("eSens").textContent = "Eye guard sensitivity: " + (eye.cfg.strict ? "Strict" : "Normal");
      $("eCal").textContent = eye.busy() ? "Calibrating\u2026" : "Calibrate distance" + (eye.hasCal() ? " (done)" : "");
      $("eCal").disabled = eye.busy() || !eye.has();
      $("eSens").disabled = !eye.cfg.on; $("eReset").hidden = !eye.hasCal();
      $("eNote").textContent = eye.note();
    }
    eye.onNote(elabel);
    $("eOn").onclick = function () { eye.tapOn(); elabel(); };
    $("eSens").onclick = function () { eye.setStrict(!eye.cfg.strict); elabel(); };
    $("eCal").onclick = function () {
      eye.calibrate(function (r) { if ($("eNote")) $("eNote").textContent = r === "none" ? "No face was seen. Try again, with his face in view." : "Calibrated. Closer than this (plus a margin) covers the screen."; });
      elabel();
    };
    $("eReset").onclick = function () { eye.resetCal(); elabel(); };
    voice.onNote(vlabel);
    $("vOn").onclick = function () { voice.setOn(!voice.cfg.on); vlabel(); };
    $("vRead").onclick = function () { voice.setRead(!voice.cfg.read); vlabel(); };
    $("vFb").onclick = function () { voice.setFb(!voice.cfg.fb); vlabel(); };
    $("vLang").onclick = function () { voice.setLang(voice.cfg.lang === "es" ? "en" : "es"); relabelAll(); vlabel(); };
    $("qMode").onclick = function () { appMode.setStart({ choose: "piano", piano: "math", math: "choose" }[appMode.startMode()]); mlabel(); closeGate(); };
    function cycle(list, v) { return list[(list.indexOf(v) + 1) % list.length]; }
    $("qOn").onclick = function () { quiz.cfg.on = !quiz.cfg.on; quiz.save(); label(); };
    $("qEvery").onclick = function () { quiz.cfg.every = cycle([1, 2, 3, 4], quiz.cfg.every); quiz.save(); label(); };
    $("qNeed").onclick = function () { quiz.cfg.need = cycle([1, 2, 3], quiz.cfg.need); quiz.save(); label(); };
    $("qLevel").onclick = function () { quiz.cfg.level = cycle([1, 2, 3, 4, 5, 6, 7], quiz.cfg.level); label(); };

    // Results panel: today / all time, level, streak, and the last 20 mistakes
    function two(n) { return n < 10 ? "0" + n : "" + n; }
    function practiseHtml() {
      var p = quiz.practising();
      return row("Practising", p.list.length + (p.list.length === 1 ? " question" : " questions")) + row("Mastered today", p.mastered) +
        (p.list.length ? '<div class="miss">' + p.list.map(function (x) { return x.a + (x.plus ? " + " : " \u2212 ") + x.b + " (level " + x.lv + ")"; }).join(" &middot; ") + "</div>" : "");
    }
    function lockHtml() {
      var D = act.data(), LN = { mistakes: "too many mistakes", time: "screen time over", "break": "break" }, h = row("Earned today", guard.earnedText()) + '<div class="sub">Locks</div>';
      function when(iso) { var t = new Date(iso); return t.getDate() + "/" + (t.getMonth() + 1) + " " + two(t.getHours()) + ":" + two(t.getMinutes()); }
      (D.lk || []).slice(-8).reverse().forEach(function (e) {
        h += '<div class="miss">' + when(e.t) + " &middot; " + LN[e.r] + " &middot; " + (e.ut ? "unlocked " + when(e.ut) + " (" + e.u + ")" : "still locked") + "</div>";
      });
      if (!(D.lk || []).length) h += '<div class="miss">None</div>';
      h += '<div class="sub">Minutes earned</div>';
      (D.er || []).slice(-5).reverse().forEach(function (e) { h += '<div class="miss">' + when(e.t) + " &middot; +" + e.m + " min</div>"; });
      return D.er && D.er.length ? h : h + '<div class="miss">None</div>';
    }
    function renderResults() {
      var r = quiz.results(), box = $("resBody");
      function line(name, o) { return '<div class="row"><span>' + name + "</span><b>&#9989; " + o.right + " &nbsp; &#10060; " + o.wrong + " &nbsp; " + o.pct + "%</b></div>"; }
      var h = line("Today", r.today) + line("All time", r.all) +
        '<div class="row"><span>Level</span><b>' + r.level + ' of 7</b></div>' +
        '<div class="row"><span>Right in a row</span><b>' + r.streak + "</b></div>" + practiseHtml() +
        '<div style="margin-top:10px;color:var(--muted)">Last mistakes</div><div class="list">';
      if (!r.mistakes.length) h += '<div class="miss">None yet &#127775;</div>';
      r.mistakes.forEach(function (m) {
        var d = new Date(m.t), when = d.toDateString() === new Date().toDateString() ? "" : (d.getDate() + "/" + (d.getMonth() + 1) + " ");
        h += '<div class="miss">' + when + two(d.getHours()) + ":" + two(d.getMinutes()) + " &middot; " + m.q + " &middot; said <b>" + m.a + "</b>, right " + m.c + "</div>";
      });
      box.innerHTML = h + "</div>" + hintTestHtml();
      $("resClear").textContent = "Clear records";
    }
    // The column-hint test: per style, how often it was shown, right right after it, and right on the next one alone (the score)
    function hintTestHtml() {
      var st = quiz.hintStats(), N = { A: "&#10024; Magic numbers", B: "&#129521; Blocks", C: "&#128587; Do it with me" }, h = '<div style="margin-top:10px;color:var(--muted)">&#128161; Hint test (column sums)</div>';
      HINT_STYLES.forEach(function (k) {
        var s = st.s[k];
        h += '<div class="row"><span>' + N[k] + (st.win === k ? " &#127942;" : "") + "</span><b>" + s.n + " hints &middot; next one alone " +
          (s.nx ? s.nok + "/" + s.nx + " (" + Math.round(100 * s.nok / s.nx) + "%)" : "-") + "</b></div>";
      });
      return h + '<div class="miss">' + (st.win ? "Winner so far: " + N[st.win] + ". Pick it in the Menu (Hint style) to use only that one."
        : "A winner is named when every style has " + st.need + " \"next one alone\" answers.") + "</div>";
    }
    function sensLabel() { $("qSens").textContent = "Key sensitivity: " + window.pianoSens(); }
    $("qSens").onclick = function () { window.pianoSens(true); sensLabel(); };
    sensLabel();
    // Activity panel: tabs Today / 7 days / Lessons / Quiz, read from act.data() and quiz.results()
    var INAME = { grand: "Grand piano", soft: "Soft piano", musicbox: "Music box", epiano: "Electric piano", organ: "Organ" };
    var TABS = [["today", "Today"], ["week", "7 days"], ["lessons", "Lessons"], ["quiz", "Quiz"]], tab = "today";
    function esc(t) { return String(t).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
    function mins(sec) { return sec < 30 ? (sec > 0 ? "<1 min" : "0 min") : Math.round(sec / 60) + " min"; }
    function row(a, b) { return '<div class="row"><span>' + a + "</span><b>" + b + "</b></div>"; }
    function topOf(maps, n, nameOf) {
      var tot = {}; maps.forEach(function (m) { Object.keys(m || {}).forEach(function (k) { tot[k] = (tot[k] || 0) + m[k]; }); });
      return Object.keys(tot).sort(function (a, b) { return tot[b] - tot[a]; }).slice(0, n).map(function (k) { return esc(nameOf ? nameOf(k) : k) + " (" + tot[k] + ")"; }).join(", ") || "-";
    }
    function dayRows(list) {   // list of day records
      var nn = 0, pa = 0, mt = 0, ey = 0; list.forEach(function (d) { nn += d.nn; pa += d.pa; mt += d.mt || 0; ey += d.ey || 0; });
      return row("Too close to the screen", ey + (ey === 1 ? " time" : " times")) + row("Math-only time", mins(mt)) + row("Play along", mins(pa)) + row("Notes played", nn) +
        row("Favourite sound", topOf(list.map(function (d) { return d.ins; }), 1, function (k) { return INAME[k] || k; })) +
        row("Most played notes", topOf(list.map(function (d) { return d.nt; }), 5));
    }
    function renderAct() {
      var D = act.data(), h = "", i, k, d;
      $("actTabs").innerHTML = TABS.map(function (t) { return '<button data-t="' + t[0] + '"' + (t[0] === tab ? ' class="on"' : "") + ">" + t[1] + "</button>"; }).join("");
      [].forEach.call($("actTabs").children, function (b) { b.onclick = function () { tab = b.dataset.t; renderAct(); }; });
      if (tab === "today") {
        d = D.d[act.key(new Date())] || { s: 0, n: 0, f: "", l: "", pa: 0, mt: 0, nn: 0, ins: {}, nt: {} };
        h = row("Screen time", mins(d.s)) + row("Daily limit", guard.summary()) + row("Times opened", d.n) + row("First / last use", (d.f || "-") + " / " + (d.l || "-")) + dayRows([d]) + lockHtml();
      } else if (tab === "week") {
        var days = [], max = 1, list = [];
        for (i = 6; i >= 0; i--) {
          var dt = new Date(Date.now() - i * 864e5); k = act.key(dt); d = D.d[k];
          days.push([dt.toDateString().slice(0, 7), d ? d.s : 0]); if (d) { list.push(d); max = Math.max(max, d.s); }
        }
        days.forEach(function (x) { h += '<div class="bar"><i>' + x[0] + '</i><span><b style="width:' + Math.round(100 * x[1] / max) + '%"></b></span><em>' + mins(x[1]) + "</em></div>"; });
        var tot = 0; list.forEach(function (x) { tot += x.s; });
        h += '<div class="sub"></div>' + row("Screen time, 7 days", mins(tot)) + dayRows(list);
      } else if (tab === "lessons") {
        var ls = Object.keys(D.les).map(function (id) { return D.les[id]; }).sort(function (a, b) { return b.sec - a.sec; }).slice(0, 5);
        if (!ls.length) h = '<div class="miss">No lessons watched yet</div>';
        ls.forEach(function (L) {
          var w = L.last ? new Date(L.last) : null;
          h += row(esc(L.t), mins(L.sec)) + '<div class="miss">started ' + L.st + " &middot; finished " + L.fin +
            (w ? " &middot; last " + w.getDate() + "/" + (w.getMonth() + 1) : "") + "</div>";
        });
      } else {
        var r = quiz.results();
        h = row("Today", r.today.right + " right, " + r.today.wrong + " wrong (" + r.today.pct + "%)") +
          row("All time", r.all.right + " right, " + r.all.wrong + " wrong (" + r.all.pct + "%)") +
          row("Level / streak", r.level + " of 7 / " + r.streak) + practiseHtml() +
          '<div class="sub">Level changes</div>' + (D.lv.slice(-5).reverse().map(function (x) { var q = new Date(x.t);
            return '<div class="miss">' + q.getDate() + "/" + (q.getMonth() + 1) + " &middot; level " + x.l + "</div>"; }).join("") || '<div class="miss">None logged yet</div>') +
          '<div class="sub">Last mistakes</div><div class="list">' + (r.mistakes.slice(0, 10).map(function (m) { var q = new Date(m.t);
            return '<div class="miss">' + q.getDate() + "/" + (q.getMonth() + 1) + " " + two(q.getHours()) + ":" + two(q.getMinutes()) + " &middot; " + m.q + " &middot; said <b>" + m.a + "</b>, right " + m.c + "</div>"; }).join("") || '<div class="miss">None yet</div>') + "</div>";
      }
      $("actBody").innerHTML = h;
      $("actClear").textContent = "Clear activity";
    }
    $("qAct").onclick = function () { tab = "today"; renderAct(); $("act").classList.add("open"); };
    $("actBack").onclick = function () { $("act").classList.remove("open"); };
    $("actClear").onclick = function () {
      if ($("actClear").textContent === "Clear activity") { $("actClear").textContent = "Tap again to clear"; return; }
      act.clear(); renderAct();
    };
    $("qRes").onclick = function () { renderResults(); $("res").classList.add("open"); };
    $("resBack").onclick = function () { $("res").classList.remove("open"); };
    $("resClear").onclick = function () {
      if ($("resClear").textContent === "Clear records") { $("resClear").textContent = "Tap again to clear"; return; }
      quiz.clearRecords(); renderResults();
    };
    $("qTry").onclick = function () { closeGate(); quiz.show(true); };   // a parent's quiz earns nothing
    // Limits and earning
    function glabel() {
      if (!$("gLock")) return;
      var c = guard.cfg, lk = guard.locked();
      $("rvOn").textContent = "\ud83d\udd01 Repeat missed questions: " + (quiz.cfg.review ? "ON" : "OFF");
      $("hintOn").textContent = "\ud83d\udca1 Hints: " + (quiz.cfg.hint ? "after " + quiz.cfg.hint + " s (column sums: nudge, full hint at " + 2 * quiz.cfg.hint + " s)" : "OFF");
      $("hintSty").textContent = "\ud83c\udfa8 Hint style: " + { test: "test all 3 (A, B, C take turns)", A: "\u2728 Magic numbers", B: "\ud83e\uddf1 Blocks", C: "\ud83d\ude4b Do it with me" }[quiz.cfg.style];
      $("gLim").textContent = "\u23f0 Daily screen time: " + (c.limit ? c.limit + " min" : "Off");
      $("gEarn").textContent = "\u2797 Earn minutes with math: " + (c.earn ? "ON" : "OFF");
      $("gNeed").textContent = "Streak needed: " + c.need; $("gMin").textContent = "Minutes per streak: " + c.min; $("gCap").textContent = "Max earned per day: " + c.cap;
      $("gNeed").disabled = $("gMin").disabled = $("gCap").disabled = !c.earn;
      $("gLock").textContent = "\ud83d\uded1 Mistake lock: " + (c.lockOn ? "ON" : "OFF");
      $("gMax").textContent = "❤️ Hearts: " + c.max + " (a mistake breaks one, 5 right in a row win one back)"; $("gWin").textContent = "Within: " + c.win + " min";
      $("gMax").disabled = $("gWin").disabled = !c.lockOn;
      $("gCalm").textContent = "Mistake screen: " + (c.calm ? "Calm" : "Dramatic");
      $("lkNow").hidden = !lk; $("lkBreak").hidden = lk && guard.reason() === "time";
      $("tP15").disabled = $("tP30").disabled = $("tNone").disabled = !c.limit;
      $("gNote").textContent = guard.note() + " Earned today: " + guard.earnedText() + ".";
    }
    guard.onChange(glabel);
    function gset(k, list) { guard.cfg[k] = list ? cycle(list, guard.cfg[k]) : !guard.cfg[k]; guard.save(); glabel(); }
    $("rvOn").onclick = function () { quiz.cfg.review = !quiz.cfg.review; quiz.save(); glabel(); };
    $("hintOn").onclick = function () { quiz.cfg.hint = cycle([20, 30, 45, 0], quiz.cfg.hint); quiz.save(); glabel(); };
    $("hintSty").onclick = function () { quiz.cfg.style = cycle(["test", "A", "B", "C"], quiz.cfg.style); quiz.save(); glabel(); };
    $("gLim").onclick = function () { gset("limit", [0, 30, 45, 60, 90, 120]); };
    $("gEarn").onclick = function () { gset("earn"); };
    $("gNeed").onclick = function () { gset("need", [3, 5, 10]); };
    $("gMin").onclick = function () { gset("min", [2, 5, 10]); };
    $("gCap").onclick = function () { gset("cap", [15, 30, 60]); };
    $("gLock").onclick = function () { gset("lockOn"); };
    $("gMax").onclick = function () { gset("max", [3, 5, 7, 10]); };
    $("gWin").onclick = function () { gset("win", [15, 30, 60]); };
    $("gCalm").onclick = function () { gset("calm"); };
    $("tP15").onclick = function () { guard.extend(15); glabel(); };
    $("tP30").onclick = function () { guard.extend(30); glabel(); };
    $("tNone").onclick = function () { guard.noLimit(); glabel(); };
    $("lkNow").onclick = function () { guard.unlockNow(); closeGate(); };
    $("lkBreak").onclick = function () { guard.breakFor(15); closeGate(); };
    label(); vlabel(); mlabel(); elabel(); glabel();

    $("doClose").onclick = function () { if (bridge) bridge.unlock(); };
    $("doChange").onclick = function () { mode = "new"; $("ge").textContent = ""; show(L("Create a new 4-digit PIN", "Crea un PIN nuevo de 4 números")); };
    $("doCancel").onclick = closeGate;
    }
    $("lock").onclick = open;

    ["1","2","3","4","5","6","7","8","9","Cancel","0","⌫"].forEach(function (k) {
      var b = document.createElement("button");
      b.textContent = k;
      if (k === "Cancel") onLang(function () { b.textContent = L("Cancel", "Cancelar"); });
      b.onclick = function () {
        if (k === "Cancel") { closeGate(); return; }
        if (k === "⌫") { ans = ans.slice(0, -1); }
        else if (ans.length < 4) { ans += k; }
        $("ga").textContent = "•".repeat(ans.length);
        if (ans.length === 4) setTimeout(submit, 150);
      };
      pad.appendChild(b);
    });
  })();
</script>
<script>
  if (window.Voice && Voice.ttsInit) Voice.ttsInit();  // the speaking voices (questions, praise, explanations) work without Voice quiz
  autoFit(document.querySelector(".qcard")); autoFit(document.getElementById("qredIn")); autoFit(document.getElementById("tIn"));
  guard.start();                                     // a lock survives a restart
  appMode.boot();                                    // the start screen (or the mode the grown-up fixed)
  if (voice.cfg.on) setTimeout(voice.prepare, 1500); // loads the voice model (and asks for the microphone the first time)
</script>
